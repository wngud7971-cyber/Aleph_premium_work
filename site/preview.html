<script>

 const root=document.getElementById('pds-soft-journal-study');
 const memory={}; const renderers={}; const restored=window.openai?.widgetState?.modelContent;
 const persist=()=>{if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{study:'soft-journal',designs:Object.fromEntries(Object.entries(memory).map(([k,v])=>[k,{compact:v.compact,dark:v.dark,accent:v.accent,date:v.date,tab:v.tab}]))},privateContent:null}).catch(()=>{});};
 const fmt=new Intl.DateTimeFormat('ko-KR',{month:'long',day:'numeric',weekday:'long'});
 const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
 const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 root.querySelectorAll('.app').forEach(app=>{
  const key=app.dataset.design;const stored=restored?.study==='soft-journal'?restored.designs?.[key]:null;
  const state=memory[key]={compact:stored?.compact===true,dark:stored?.dark===true,accent:/^#[0-9a-f]{6}$/i.test(stored?.accent||'')?stored.accent:'#e3baca',date:/^2026-10-\d{2}$/.test(stored?.date||'')?stored.date:'2026-10-16',tab:['plan','workout','review'].includes(stored?.tab)?stored.tab:'plan',month:9,year:2026,page:'calendar',saved:{},drafts:{},meditation:false};
  const records={
   '2026-10-14':[{title:'주간 계획 정리',done:true,time:'09:00'},{title:'산책하기',done:true,time:'18:00'}],
   '2026-10-15':[{title:'자료 읽고 핵심 정리',done:true,time:'10:00'},{title:'가볍게 걷기',done:false,time:'19:00'}],
   '2026-10-16':[{title:'앱 화면 비교하고 선택하기',done:true,time:'10:00'},{title:'오늘 할 일 정리',done:false,time:''},{title:'저녁에 30분 걷기',done:false,time:'19:00'}],
   '2026-10-19':[{title:'다음 주 계획 세우기',done:false,time:''}],
   '2026-10-22':[{title:'운동 기록 돌아보기',done:false,time:''}]
  };
  app.innerHTML=`<header class="bar"><span class="brand">PDS</span><span class="brandname">나의 기록</span><nav class="nav" aria-label="주 메뉴"><button type="button" class="button cursor-interaction" data-page="calendar" aria-pressed="true">캘린더</button><button type="button" class="button cursor-interaction" data-page="stats" aria-pressed="false">통계</button><button type="button" class="button cursor-interaction" data-page="settings" aria-pressed="false">설정</button></nav><span class="spacer"></span><button type="button" class="button quiet cursor-interaction" data-action="theme">다크 모드</button><button type="button" class="button cursor-interaction" data-action="size">소형 모드</button></header>
  <main class="layout" data-screen="calendar"><section class="calendar" aria-label="월간 캘린더"><div class="month"><div><small>2026년</small><h2 data-month></h2></div><span class="spacer"></span><button type="button" class="button cursor-interaction" data-shift="-1" aria-label="이전 달">‹</button><button type="button" class="button cursor-interaction" data-action="today">오늘</button><button type="button" class="button cursor-interaction" data-shift="1" aria-label="다음 달">›</button><button type="button" class="button cursor-interaction" data-action="meditate">5분 명상</button></div><div class="week" aria-hidden="true"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span><span>일</span></div><div class="grid" aria-label="날짜 선택"></div><div class="summary" data-summary></div><section class="meditation" aria-label="5분 명상 안내" hidden><button type="button" class="button quiet dismiss cursor-interaction" data-action="dismiss" aria-label="명상 안내 닫기">×</button><span class="sub">오늘을 시작하기 전에</span><strong>나를 위한 5분 명상</strong><p>잠시 호흡을 고르고,<br>오늘의 첫 계획을 떠올려 보세요.</p></section></section>
  <aside class="detail" aria-label="날짜 상세"><header class="datehead"><span class="datebadge" data-datebadge></span><div><span class="sub" data-dateyear>2026년 10월</span><h3 data-date></h3></div><span class="spacer"></span><button type="button" class="button quiet cursor-interaction" data-action="close" aria-label="상세 닫기">×</button></header><div class="tabs" role="tablist" aria-label="날짜 기록 종류">${[['plan','계획'],['workout','운동'],['review','회고']].map(([id,label])=>`<button type="button" role="tab" id="${key}-${id}" aria-controls="${key}-${id}-panel" aria-selected="${id===state.tab}" data-tab="${id}" class="cursor-interaction">${label}</button>`).join('')}</div><div class="detailbody">
  <section id="${key}-plan-panel" role="tabpanel" aria-labelledby="${key}-plan" data-panel="plan"><div class="sectiontitle">오늘의 계획<span class="daily-count" data-daily-count></span></div><div data-plans></div><label class="field">새 계획<input data-title maxlength="100" placeholder="오늘 무엇을 할까요?"></label><label class="time-switch"><input type="checkbox" data-time-toggle>시간 지정 · 선택</label><label class="field time-field" data-time-field hidden>예정 시간<input type="time" data-time></label></section>
  <section id="${key}-workout-panel" role="tabpanel" aria-labelledby="${key}-workout" data-panel="workout" hidden><div class="sectiontitle">오늘의 운동</div><label class="field">운동 종류<select data-sport><option>걷기</option><option>계단 걷기</option><option>실내 사이클</option><option>실외 사이클</option><option>풋살</option><option>배드민턴</option><option>테니스</option><option>스쿼시</option><option>플랭크</option></select></label><label class="field">시간 · 분<input type="number" data-duration min="1" max="1440" value="30"></label><div class="note"><span>남긴 기록</span><p data-workout-note>아직 기록이 없어요.</p></div></section>
  <section id="${key}-review-panel" role="tabpanel" aria-labelledby="${key}-review" data-panel="review" hidden><div class="sectiontitle">오늘 돌아보기<span class="daily-count">모두 선택 입력</span></div>${['잘한 점','아쉬운 점','내일 바꿔볼 점'].map((t,i)=>`<label class="field">${t}<textarea data-review="${i}" placeholder="${['오늘 나에게 해주고 싶은 칭찬','조금 아쉬웠던 순간','내일을 위한 작은 약속'][i]}"></textarea></label>`).join('')}</section></div><footer class="savebar"><span class="status" aria-live="polite">예시 기록</span><button type="button" class="button save cursor-interaction" data-action="save">저장</button></footer></aside></main>
  <section class="screen" data-screen="stats" hidden><h2>나의 기록</h2><div data-periods><button class="button active cursor-interaction" type="button" data-period="week">주간</button> <button class="button cursor-interaction" type="button" data-period="month">월간</button> <button class="button cursor-interaction" type="button" data-period="weekday">요일별</button></div><p class="sub" data-period-label>10월 12일 – 18일 · 예시 통계</p><div data-stats></div></section>
  <section class="screen" data-screen="settings" hidden><h2>내 취향대로</h2><div class="setting"><span>화면 테마</span><button type="button" class="button cursor-interaction" data-action="theme">다크 모드</button></div><div class="setting"><label for="${key}-color">강조 색상</label><input id="${key}-color" type="color" value="${state.accent}" data-color></div><div class="setting"><span>창 모드</span><button type="button" class="button cursor-interaction" data-action="size">소형 모드</button></div></section>
  <footer class="footer"><span>디자인 검토용 · 예시 입력</span><span>개인 기록과 연결되지 않음</span></footer>`;
  const $=s=>app.querySelector(s);const all=s=>app.querySelectorAll(s);
  function draft(){return state.drafts[state.date]??=structuredClone(records[state.date]||[]);}
  function status(t){$('.status').textContent=t;}
  function fit(){if(state.page!=='calendar')return;const pane=$('.calendar');const month=$('.month'),week=$('.week'),summary=$('.summary');if(!pane.clientWidth||!pane.clientHeight)return;const cs=getComputedStyle(pane);const padX=parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight);const padY=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom);const available=pane.clientHeight-padY-month.getBoundingClientRect().height-parseFloat(getComputedStyle(month).marginBottom)-week.getBoundingClientRect().height-summary.getBoundingClientRect().height-10;const rows=$('.grid').children.length/7;const gridStyle=getComputedStyle($('.grid'));const gapX=parseFloat(gridStyle.columnGap)||0,gapY=parseFloat(gridStyle.rowGap)||0;const cell=Math.max(46,Math.floor((available-gapY*(rows-1))/rows));const board=Math.min(pane.clientWidth-padX,cell*7+gapX*6);pane.style.setProperty('--board',`${Math.max(196,board)}px`);}
  function grid(){const first=new Date(state.year,state.month,1,12);const shift=(first.getDay()+6)%7;const total=Math.ceil((shift+new Date(state.year,state.month+1,0).getDate())/7)*7;$('.month h2').innerHTML=`<span class="month-number">${new Intl.DateTimeFormat("en-US",{month:"long"}).format(first)}</span>`;$('.month small').textContent=`${state.year}년`;$('.month h2').setAttribute('aria-label',`${state.year}년 ${state.month+1}월`);$('.grid').innerHTML=Array.from({length:total},(_,i)=>{const d=new Date(state.year,state.month,1-shift+i,12),dk=dateKey(d),p=records[dk]||[];return `<button type="button" class="day cursor-interaction${d.getMonth()!==state.month?' other':''}${dk===state.date?' selected':''}${dk==='2026-10-16'?' today':''}" data-datekey="${dk}" aria-label="${fmt.format(d)}${p.length?`, 계획 ${p.length}, 완료 ${p.filter(x=>x.done).length}`:''}" aria-pressed="${dk===state.date}"><span class="number">${d.getDate()}</span>${p.length?`<span class="counts"><span>계획 ${p.length}</span><span>완료 ${p.filter(x=>x.done).length}</span></span>`:''}</button>`;}).join('');const p=records[state.date]||[];$('.summary').innerHTML=`<span>계획 <b>${p.length}</b></span><span>완료 <b>${p.filter(x=>x.done).length}</b></span><span>운동 <b>${state.saved[state.date]?.duration||0}분</b></span>`;requestAnimationFrame(fit);}
  function detail(){const d=new Date(state.date+'T12:00:00');$('[data-date]').textContent=new Intl.DateTimeFormat('ko-KR',{weekday:'long'}).format(d);$('[data-dateyear]').textContent=`${d.getFullYear()}년 ${d.getMonth()+1}월`;$('[data-datebadge]').textContent=d.getDate();const plans=draft();$('[data-daily-count]').textContent=`${plans.filter(p=>p.done).length} / ${plans.length} 완료`;$('[data-plans]').innerHTML=plans.length?plans.map((p,i)=>`<label class="planrow ${p.done?'done':''}"><input type="checkbox" data-check="${i}" ${p.done?'checked':''}><span><span class="plantitle">${esc(p.title)}</span><small>${p.time||'시간 미지정'}</small></span></label>`).join(''):'<p class="sub">아직 계획이 없어요.<br>작은 일부터 하나 적어보세요.</p>';const entry=state.saved[state.date];$('[data-title]').value='';$('[data-time]').value='';$('[data-time-toggle]').checked=false;$('[data-time-field]').hidden=true;$('[data-sport]').value=entry?.sport||'걷기';$('[data-duration]').value=entry?.duration||30;$('[data-workout-note]').textContent=entry?.duration?`${entry.sport} · ${entry.duration}분`:'아직 기록이 없어요.';all('[data-review]').forEach(el=>el.value=entry?.review?.[Number(el.dataset.review)]||'');tabs();status('예시 기록');}
  function tabs(){all('[data-tab]').forEach(el=>el.setAttribute('aria-selected',String(el.dataset.tab===state.tab)));all('[data-panel]').forEach(el=>el.hidden=el.dataset.panel!==state.tab);}
  function appearance(){app.classList.toggle('compact',state.compact);app.classList.toggle('dark',state.dark);app.style.setProperty('--yellow',state.accent);app.style.setProperty('--note',state.dark?`color-mix(in srgb,${state.accent} 13%,#1e2023)`:`color-mix(in srgb,${state.accent} 35%,#fff)`);all('[data-action="theme"]').forEach(el=>el.textContent=state.dark?'라이트 모드':'다크 모드');all('[data-action="size"]').forEach(el=>el.textContent=state.compact?'일반 창':'소형 모드');$('[data-color]').value=state.accent;requestAnimationFrame(fit);}
  function stats(period='week'){const labels=period==='month'?['1주','2주','3주','4주','5주']:['월','화','수','목','금','토','일'];const values=period==='month'?[[4,6],[8,10],[6,9],[0,3],[0,0]]:[[1,2],[2,3],[2,2],[1,2],[1,3],[0,0],[0,0]];$('[data-stats]').innerHTML=labels.map((l,i)=>{const [done,total]=values[i];return `<div class="statrow"><span>${l}</span><div class="track"><div class="fill" style="width:${total?Math.round(done/total*100):0}%"></div></div><span>${done} / ${total} 완료</span></div>`;}).join('');$('[data-period-label]').textContent=period==='month'?'2026년 10월 계획 완료 · 예시 통계':period==='weekday'?'10월 요일별 계획 완료 · 예시 통계':'10월 12일 – 18일 계획 완료 · 예시 통계';}
  app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
   if(b.dataset.datekey){state.date=b.dataset.datekey;state.compact=false;app.classList.remove('no-detail');appearance();grid();detail();}
   if(b.dataset.tab){state.tab=b.dataset.tab;tabs();$('.detailbody').scrollTop=0;}
   if(b.dataset.page){state.page=b.dataset.page;all('[data-screen]').forEach(el=>el.hidden=el.dataset.screen!==state.page);all('[data-page]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.page===state.page)));if(state.page==='stats')stats();requestAnimationFrame(fit);}
   if(b.dataset.shift){state.month+=Number(b.dataset.shift);if(state.month<0){state.month=11;state.year--;}if(state.month>11){state.month=0;state.year++;}grid();}
   if(b.dataset.period){all('[data-period]').forEach(el=>el.classList.toggle('active',el===b));stats(b.dataset.period);}
   const a=b.dataset.action;if(a==='theme'){state.dark=!state.dark;appearance();}if(a==='size'){state.compact=!state.compact;appearance();}if(a==='close'){app.classList.add('no-detail');requestAnimationFrame(fit);}if(a==='meditate'){state.meditation=!state.meditation;$('.meditation').hidden=!state.meditation;}if(a==='dismiss'){state.meditation=false;$('.meditation').hidden=true;}if(a==='today'){state.date='2026-10-16';state.year=2026;state.month=9;grid();detail();}
   if(a==='save'){const list=draft();if(state.tab==='plan'){const title=$('[data-title]').value.trim();if(title)list.push({title,done:false,time:$('[data-time-toggle]').checked?$('[data-time]').value:''});records[state.date]=structuredClone(list);$('[data-title]').value='';$('[data-time]').value='';}const saved=state.saved[state.date]??={};if(state.tab==='workout'){const mins=Number($('[data-duration]').value);if(!Number.isFinite(mins)||mins<=0||mins>1440){status('시간을 1–1440분 사이로 입력해 주세요.');return;}saved.duration=mins;saved.sport=$('[data-sport]').value;$('[data-workout-note]').textContent=`${saved.sport} · ${mins}분`;}if(state.tab==='review')saved.review=Array.from(all('[data-review]')).map(el=>el.value);if(state.tab==='plan')detail();grid();status('저장 완료 · 예시');}
   persist();
  });
  app.addEventListener('change',e=>{if(e.target.matches('[data-check]')){draft()[Number(e.target.dataset.check)].done=e.target.checked;e.target.closest('.planrow').classList.toggle('done',e.target.checked);status('저장 전 변경사항');}if(e.target.matches('[data-time-toggle]')){$('[data-time-field]').hidden=!e.target.checked;status('저장 전 변경사항');}if(e.target.matches('[data-color]')){state.accent=e.target.value;appearance();persist();}});
  app.addEventListener('input',e=>{if(e.target.matches('[data-title],[data-time],[data-duration],[data-review]'))status('저장 전 변경사항');});
  renderers[key]=()=>{appearance();tabs();};
  new ResizeObserver(()=>requestAnimationFrame(fit)).observe(app);appearance();grid();detail();
  if(globalThis.Tweak){const config={radius:16};const tweak=new Tweak({container:app,onChange:()=>{app.style.setProperty('--radius',`${config.radius}px`);appearance();persist();}});tweak.addColorPicker(state,'accent',{label:'강조 색상',reference:'--yellow'});tweak.addSlider(config,'radius',{label:'창 모서리',min:0,max:20,unit:'px'});tweak.addToggle(state,'dark',{label:'다크 모드'});}
 });
 window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.modelContent;if(s?.study!=='soft-journal')return;Object.entries(memory).forEach(([key,st])=>{const v=s.designs?.[key];if(!v)return;if(typeof v.dark==='boolean')st.dark=v.dark;if(typeof v.compact==='boolean')st.compact=v.compact;if(/^#[0-9a-f]{6}$/i.test(v.accent||''))st.accent=v.accent;if(['plan','workout','review'].includes(v.tab))st.tab=v.tab;renderers[key]();});});
})();
</script>
